[package]
name = "meeko-hookd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Meeko agent bridge: a memory-only projection of the Codync host, served over a 0600 unix socket."
publish = false

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
